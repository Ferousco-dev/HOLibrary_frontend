# Runs on every pull request. It checks only things that are objectively right
# or wrong, so that review can be about the design instead of about a missing
# alt attribute.
name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  html:
    name: HTML and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same script everyone runs locally with `python3 scripts/check.py`,
      # so a green run here is never a surprise.
      - name: House rules
        run: python3 scripts/check.py

      - name: Valid HTML
        run: |
          npm install -g html-validate --silent
          npx html-validate "**/*.html"
