<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f7fb"/><stop offset="1" stop-color="#ece9f4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#201047" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#514574"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#231344}.title{font-weight:700;font-size:34px}.sub{font-size:17px;fill:#615879}.label{font-size:14px;fill:#514574}.name{font-size:20px;font-weight:700}.stereo{font-size:14px;font-weight:700;fill:#7358a3}.detail{font-size:15px;fill:#514574}.box{fill:#fff;stroke:#cfc7df;stroke-width:2}.group{fill:#ffffff80;stroke:#a79abd;stroke-width:2;stroke-dasharray:10 7}.line{stroke:#514574;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.note{font-size:13px;fill:#776d8e}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#bg)"/>
  <text x="80" y="72" class="title">HOLibrary Frontend — UML Component Diagram</text>
  <text x="80" y="104" class="sub">Browser-based catalogue and circulation client for the Hezekiah Oluwasanmi Library</text>

  <rect x="70" y="150" width="430" height="830" rx="22" class="group"/>
  <text x="96" y="190" class="name">«device» Reader or staff browser</text>
  <text x="96" y="216" class="sub">HTML5 multi-page Progressive Web App</text>

  <rect x="105" y="255" width="360" height="112" rx="14" class="box" filter="url(#shadow)"/>
  <text x="130" y="286" class="stereo">«component»</text><text x="130" y="317" class="name">Page screens</text>
  <text x="130" y="344" class="detail">Catalogue · Book detail · Sign in</text>
  <text x="130" y="363" class="detail">Loans · Reservations · Desk · Admin</text>

  <rect x="105" y="422" width="360" height="122" rx="14" class="box" filter="url(#shadow)"/>
  <text x="130" y="453" class="stereo">«component»</text><text x="130" y="484" class="name">UI and navigation</text>
  <text x="130" y="510" class="detail">ui.js · nav.js · format.js</text>
  <text x="130" y="531" class="detail">Role-aware menus and accessible feedback</text>

  <rect x="105" y="599" width="360" height="122" rx="14" class="box" filter="url(#shadow)"/>
  <text x="130" y="630" class="stereo">«component»</text><text x="130" y="661" class="name">Validation and API client</text>
  <text x="130" y="687" class="detail">validate.js · api.js · config.js</text>
  <text x="130" y="708" class="detail">Fetch, errors, token refresh, API URL</text>

  <rect x="105" y="776" width="360" height="122" rx="14" class="box" filter="url(#shadow)"/>
  <text x="130" y="807" class="stereo">«component»</text><text x="130" y="838" class="name">Session and push</text>
  <text x="130" y="864" class="detail">sessionStorage · push.js · FCM worker</text>
  <text x="130" y="885" class="detail">Refresh token and browser notifications</text>

  <rect x="600" y="150" width="520" height="830" rx="22" class="group"/>
  <text x="626" y="190" class="name">«system» HOLibrary REST API</text>
  <text x="626" y="216" class="sub">https://api.library.appmd.dev/api/v1</text>

  <rect x="650" y="276" width="420" height="115" rx="14" class="box" filter="url(#shadow)"/>
  <text x="677" y="307" class="stereo">«service»</text><text x="677" y="338" class="name">Authentication and accounts</text>
  <text x="677" y="365" class="detail">Login · refresh · reset password · roles</text>

  <rect x="650" y="448" width="420" height="115" rx="14" class="box" filter="url(#shadow)"/>
  <text x="677" y="479" class="stereo">«service»</text><text x="677" y="510" class="name">Catalogue and inventory</text>
  <text x="677" y="537" class="detail">Books · copies · wings · cover metadata</text>

  <rect x="650" y="620" width="420" height="115" rx="14" class="box" filter="url(#shadow)"/>
  <text x="677" y="651" class="stereo">«service»</text><text x="677" y="682" class="name">Circulation services</text>
  <text x="677" y="709" class="detail">Issue · return · renew · reservations</text>

  <rect x="650" y="792" width="420" height="115" rx="14" class="box" filter="url(#shadow)"/>
  <text x="677" y="823" class="stereo">«service»</text><text x="677" y="854" class="name">Admin and notifications</text>
  <text x="677" y="881" class="detail">Members · reports · device registration</text>

  <rect x="1230" y="150" width="500" height="830" rx="22" class="group"/>
  <text x="1256" y="190" class="name">«external systems»</text>
  <text x="1256" y="216" class="sub">Services used by the client application</text>

  <rect x="1280" y="286" width="400" height="120" rx="14" class="box" filter="url(#shadow)"/>
  <text x="1307" y="317" class="stereo">«platform»</text><text x="1307" y="348" class="name">Vercel</text>
  <text x="1307" y="375" class="detail">Static hosting · clean URL rewrites · HTTPS</text>

  <rect x="1280" y="480" width="400" height="120" rx="14" class="box" filter="url(#shadow)"/>
  <text x="1307" y="511" class="stereo">«external API»</text><text x="1307" y="542" class="name">Open Library Covers API</text>
  <text x="1307" y="569" class="detail">ISBN-addressed book-cover images</text>

  <rect x="1280" y="674" width="400" height="120" rx="14" class="box" filter="url(#shadow)"/>
  <text x="1307" y="705" class="stereo">«push platform»</text><text x="1307" y="736" class="name">Firebase Cloud Messaging</text>
  <text x="1307" y="763" class="detail">Reservation and due-date notifications</text>

  <path d="M285 367 L285 422" class="line"/><path d="M285 544 L285 599" class="line"/><path d="M285 721 L285 776" class="line"/>
  <path d="M465 660 L648 660" class="line"/><text x="501" y="642" class="label">HTTPS / JSON</text>
  <path d="M1122 504 L1278 540" class="line dash"/><text x="1137" y="488" class="label">cover images</text>
  <path d="M465 836 C730 1028, 1300 1018, 1450 795" class="line dash"/><text x="911" y="1035" class="label">service-worker subscription &amp; notifications</text>
  <path d="M1280 346 L1122 346" class="line dash"/><text x="1138" y="327" class="label">deploys frontend</text>

  <rect x="72" y="1022" width="1656" height="48" rx="10" fill="#24104f"/>
  <text x="98" y="1052" fill="#fff" style="font-family:Arial,Helvetica,sans-serif;font-size:16px">Key flow: user action → page/UI modules → API client → HOLibrary API. The server enforces authentication and permissions; the browser only renders permitted features.</text>
</svg>
